name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_env:
        description: "Target environment"
        type: choice
        options: [dev, uat, pre-prod, prod]
        default: uat

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_ENV: ${{ github.event.inputs.test_env || 'uat' }}
      PW_WORKERS: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and format check
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests (visual excluded — see `visual` job)
        run: npx playwright test --grep-invert "Visual regression"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload traces and videos of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  visual:
    # Same image as scripts/visual-docker.sh, so rendering matches the committed baselines.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep in sync with @playwright/test in package.json
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      TEST_ENV: ${{ github.event.inputs.test_env || 'uat' }}
      HOME: /root

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Visual regression
        run: npx playwright test tests/visual

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
