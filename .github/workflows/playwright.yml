name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full run against UAT at 03:00 UTC (feeds Jira bugs + email summary)
    - cron: "0 3 * * 1-5"
  workflow_dispatch:
    inputs:
      test_env:
        description: "Target environment"
        type: choice
        options: [dev, uat, pre-prod, prod]
        default: uat
      demo_failures:
        description: "Also run tests/demo (controlled failures) to exercise failure artifacts"
        type: boolean
        default: false

# One run per branch/PR: a new push cancels the previous run of the same ref.
# Scheduled and main runs are never cancelled (they feed Jira and the email summary).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_ENV: ${{ github.event.inputs.test_env || 'uat' }}
  DEMO_FAILURES: ${{ github.event.inputs.demo_failures == 'true' && '1' || '' }}

jobs:
  # ---------------------------------------------------------------- quality gates
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck, lint, format, unit tests
        run: |
          npm run check
          npx playwright test --project=unit

  # ---------------------------------------------------------------- browser + api matrix
  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
        total: [2]
        include:
          - project: api
            shard: 1
            total: 1
          # Mobile emulation (tests/shop only) — engine to install differs from the project name
          - project: mobile-chrome
            browser: chromium
            shard: 1
            total: 1
          - project: mobile-safari
            browser: webkit
            shard: 1
            total: 1
    env:
      PW_WORKERS: 2
      SKIP_ALLURE_REPORT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Install browser
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.browser || matrix.project }}

      - name: Run ${{ matrix.project }} (${{ matrix.shard }}/${{ matrix.total }})
        run: >
          npx playwright test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.total }}
          --grep-invert "Visual regression"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-${{ matrix.project }}-${{ matrix.shard }}
          path: allure-results/
          retention-days: 1

      - name: Upload traces and videos of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------- visual (same image as local Docker)
  visual:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep in sync with @playwright/test in package.json (guarded by tests/unit/ciConfig.unit.spec.ts)
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      HOME: /root
      SKIP_ALLURE_REPORT: 1
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - name: Visual regression
        run: npx playwright test tests/visual
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-visual
          path: blob-report/
          retention-days: 1
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------- single report
  merge-reports:
    needs: [test, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports -c merge.config.ts --reporter html ./all-blob-reports

      - name: Merge into one JSON report (input for Jira bugs and the email summary)
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-result.json npx playwright merge-reports -c merge.config.ts --reporter json ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      # ---- Trend across runs: restore the newest history from cache, feed it to the
      #      generator, save the new one (main / scheduled / manual runs only, so PR runs
      #      read the trend but never pollute it). Mirrors global-teardown.ts locally.
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Seed history into results
        run: |
          if [ -d allure-history ]; then
            mkdir -p allure-results/history
            cp -r allure-history/. allure-results/history/
            echo "Previous Allure history restored ($(ls allure-history | wc -l) files)"
          else
            echo "No previous Allure history; trend starts with this run"
          fi

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Save Allure history
        if: github.event_name != 'pull_request'
        run: rm -rf allure-history && cp -r allure-report/history allure-history

      - name: Cache Allure history
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      # ---- Close the loop (main / manual runs only, never on PRs) ----
      - name: Raise Jira bugs for failed tests
        if: github.event_name != 'pull_request' && env.JIRA_API_TOKEN != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'SCRUM' }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKIP_PREFLIGHT: 1
        run: npm run -s jira:bugs

      - name: Email execution summary
        if: github.event_name != 'pull_request' && env.EMAIL_TO != ''
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SERVICE: ${{ vars.EMAIL_SERVICE || 'gmail' }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKIP_PREFLIGHT: 1
        run: npm run -s report:email
