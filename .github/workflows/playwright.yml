name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_env:
        description: "Target environment"
        type: choice
        options: [dev, uat, pre-prod, prod]
        default: uat
      demo_failures:
        description: "Also run tests/demo (controlled failures) to exercise failure artifacts"
        type: boolean
        default: false

env:
  TEST_ENV: ${{ github.event.inputs.test_env || 'uat' }}
  DEMO_FAILURES: ${{ github.event.inputs.demo_failures == 'true' && '1' || '' }}

jobs:
  # ---------------------------------------------------------------- quality gates
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck, lint, format, unit tests
        run: |
          npm run check
          npx playwright test --project=unit

  # ---------------------------------------------------------------- browser + api matrix
  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
        total: [2]
        include:
          - project: api
            shard: 1
            total: 1
    env:
      PW_WORKERS: 2
      SKIP_ALLURE_REPORT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Install browser
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run ${{ matrix.project }} (${{ matrix.shard }}/${{ matrix.total }})
        run: >
          npx playwright test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.total }}
          --grep-invert "Visual regression"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-${{ matrix.project }}-${{ matrix.shard }}
          path: allure-results/
          retention-days: 1

      - name: Upload traces and videos of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------- visual (same image as local Docker)
  visual:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep in sync with @playwright/test in package.json (guarded by tests/unit/ciConfig.unit.spec.ts)
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      HOME: /root
      SKIP_ALLURE_REPORT: 1
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - name: Visual regression
        run: npx playwright test tests/visual
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-visual
          path: blob-report/
          retention-days: 1
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------- single report
  merge-reports:
    needs: [test, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports -c merge.config.ts --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
